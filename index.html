<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licitações perto de Itupeva</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--tx:#1d2420;--mut:#5d6a63;--bd:#d9dfda;--ac:#1f6b4a}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1d2521;--tx:#e8eee9;--mut:#9aa8a0;--bd:#2f3a34;--ac:#5fcf9a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px;font-size:.9rem}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:12px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.cont{color:var(--mut);font-size:.9rem;margin:8px 0}
article{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px}
article h2{font-size:1rem;margin:0 0 6px;font-weight:600}
.meta{color:var(--mut);font-size:.85rem;display:flex;flex-wrap:wrap;gap:4px 14px}
.tag{color:var(--ac);font-weight:600}
.links{margin-top:8px;display:flex;gap:14px;font-size:.9rem}
a{color:var(--ac)}
a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Licitações perto de Itupeva</h1>
<p class="sub" id="sub">Carregando…</p>
<div class="filtros">
  <input id="q" type="search" placeholder="Buscar no objeto ou órgão" aria-label="Buscar">
  <select id="mod" aria-label="Tipo de licitação"><option value="">Todos os tipos</option></select>
  <select id="cid" aria-label="Cidade"><option value="">Todas as cidades</option></select>
  <select id="ord" aria-label="Ordenar">
    <option value="enc">Encerra primeiro</option>
    <option value="km">Mais perto</option>
    <option value="val">Maior valor</option>
  </select>
</div>
<div class="cont" id="cont" aria-live="polite"></div>
<div id="lista"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let itens = [];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const data = s => s ? new Date(s).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}) : "—";
const brl = v => v ? v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}) : "não informado";
function opcoes(sel, valores){ [...new Set(valores)].sort().forEach(v => sel.add(new Option(v, v))); }
function render(){
  const q = $("q").value.toLowerCase(), m = $("mod").value, c = $("cid").value, o = $("ord").value;
  const r = itens.filter(i => (!m || i.modalidade === m) && (!c || i.cidade === c) &&
    (!q || (i.objeto + " " + i.orgao).toLowerCase().includes(q)));
  r.sort((a,b) => o === "km" ? a.km - b.km : o === "val" ? (b.valor||0) - (a.valor||0) : (a.encerramento||"9").localeCompare(b.encerramento||"9"));
  $("cont").textContent = r.length + " licitações";
  $("lista").innerHTML = r.map(i => `<article>
    <h2>${esc(i.objeto)}</h2>
    <div class="meta"><span class="tag">${esc(i.modalidade)}</span><span>${esc(i.cidade)}-${esc(i.uf)} (${i.km} km)</span><span>${esc(i.orgao)}</span></div>
    <div class="meta"><span>Valor estimado: ${brl(i.valor)}</span><span>Propostas até ${data(i.encerramento)}</span></div>
    <div class="links"><a href="${esc(i.link)}" target="_blank" rel="noopener">Ver no PNCP</a>${i.origem ? `<a href="${esc(i.origem)}" target="_blank" rel="noopener">Sistema do órgão</a>` : ""}</div>
  </article>`).join("");
}
fetch("data.json").then(r => r.json()).then(d => {
  itens = d.itens;
  $("sub").textContent = `Raio de ${d.raio_km} km · atualizado em ${new Date(d.atualizado).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}`;
  opcoes($("mod"), itens.map(i => i.modalidade)); opcoes($("cid"), itens.map(i => i.cidade));
  ["q","mod","cid","ord"].forEach(id => $(id).addEventListener("input", render));
  render();
}).catch(() => { $("sub").textContent = "Ainda não há dados. Rode o workflow “Atualizar licitações” no GitHub."; });
</script>
</body>
</html>
