name: Atualizar licitações
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python buscar_licitacoes.py
      - name: Salvar resultado
        run: |
          git config user.name "robo-licitacoes"
          git config user.email "robo@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Atualiza licitações" && git push)
